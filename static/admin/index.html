<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Gill Studio — Admin</title>
<style>
:root{--bg:#070707;--s1:#101010;--s2:#171717;--line:#2a2a2a;--tx:#f3efec;--mu:#9b9692;--red:#e3162b;--red2:#ff4455;color-scheme:dark}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit;background:#0b0b0b;border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;min-height:40px}
textarea{width:100%;min-height:70px}button{cursor:pointer;background:var(--s2)}button.p{background:var(--red);border-color:var(--red)}button.d{border-color:#7a2630;color:var(--red2)}
button:disabled{opacity:.5}.wrap{max-width:1180px;margin:auto;padding:1rem}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:.8rem 1rem;position:sticky;top:0;background:var(--bg);z-index:5}
h1{font:400 1.4rem Impact,sans-serif;letter-spacing:.04em;text-transform:uppercase}h1 b{color:var(--red2);font-weight:400}
.login{max-width:340px;margin:12vh auto;display:grid;gap:.7rem;padding:1rem}.err{color:var(--red2);min-height:1.2em}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.8rem 0}.row input{flex:1;min-width:160px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.6rem;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mu);font-weight:500;font-size:.8rem}
tr.i{cursor:pointer}tr.i:hover,tr.i:focus{background:var(--s1);outline:none}.tag{display:inline-block;padding:.1rem .55rem;border:1px solid var(--line);border-radius:999px;font-size:.78rem}
.tag.r{border-color:var(--red);color:var(--red2)}.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:1rem;margin:.8rem 0}
dl{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:.35rem .8rem}dt{color:var(--mu)}dd{overflow-wrap:anywhere;white-space:pre-wrap}
.note{border-left:3px solid var(--line);padding:.2rem .7rem;margin:.4rem 0}.note.u{border-color:var(--red)}.note small{color:var(--mu)}
.g{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.ok{color:#6fd08c}.hide{display:none!important}
.chips label{display:inline-flex;gap:.3rem;align-items:center;margin-right:.6rem}.chips input{min-height:auto}
@media(max-width:700px){.hc{display:none}}
</style></head><body>
<div id="login" class="login hide"><h1>Gill <b>Studio</b> admin</h1>
<input id="u" placeholder="Username" autocomplete="username" aria-label="Username"><input id="p" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
<button class="p" id="go">Sign in</button><div class="err" id="le" role="alert"></div></div>
<div id="app" class="hide">
<div class="bar"><h1>Gill <b>Studio</b> · Inquiries</h1><div class="g"><button id="bAv">Availability</button><a href="/admin/api/export.csv"><button>Export CSV</button></a><button id="out">Sign out</button></div></div>
<div class="wrap"><div id="list"><div class="row"><input id="q" placeholder="Search name, email, reference, business…" aria-label="Search"><select id="sf" aria-label="Status filter"></select></div>
<div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Ref</th><th>Client</th><th class="hc">Service</th><th>Status</th><th class="hc">Appointment</th><th class="hc">Email</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="g" style="margin-top:.8rem"><button id="pv">‹ Prev</button><span id="pg"></span><button id="nx">Next ›</button></div></div>
<div id="detail" class="hide"></div><div id="avail" class="hide"></div></div></div>
<script src="/admin/static/admin.js"></script></body></html>
